# ---------------------------------------------------------------
#  Build settings (no need to touch)
# ---------------------------------------------------------------
markdown: kramdown
permalink: /log/:year/:month/:day/:title/
timezone: America/Chicago

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - templates/
  - Gemfile
  - Gemfile.lock
